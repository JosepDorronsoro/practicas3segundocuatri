name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy matplotlib tqdm flake8

      - name: Style check (flake8)
        run: |
          flake8 apaut3/proyecto/proyecto_AAIII_02_diffusion_models/ \
            --max-line-length=100 \
            --exclude=__pycache__,data,*.pth \
            --extend-ignore=E203,W503

      - name: Run doctests
        run: |
          python -m doctest apaut3/proyecto/proyecto_AAIII_02_diffusion_models/diffusion_process.py -v
